<svg viewBox="0 0 1180 760" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Arial, sans-serif">
  <rect width="1180" height="760" fill="#FDFDFC"/>

  <!-- ============ PARENT PHONE ============ -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="360" height="720" rx="36" fill="#F9F6EC" stroke="#E2DED5" stroke-width="3"/>
    <text x="180" y="-8" text-anchor="middle" font-size="20" font-weight="bold" fill="#214B4D"> </text>

    <!-- header -->
    <rect x="28" y="34" width="90" height="34" rx="17" fill="#DFECE2" stroke="#17666B" stroke-width="1.5"/>
    <text x="73" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#17666B">Aanya</text>
    <rect x="126" y="34" width="70" height="34" rx="17" fill="none" stroke="#E2DED5" stroke-width="1.5"/>
    <text x="161" y="56" text-anchor="middle" font-size="13" fill="#52706D">Kabir</text>
    <circle cx="228" cy="51" r="17" fill="none" stroke="#E2DED5" stroke-width="1.5"/>
    <text x="228" y="57" text-anchor="middle" font-size="16" fill="#17666B">+</text>

    <!-- broadcast banner -->
    <rect x="28" y="82" width="304" height="34" rx="10" fill="#DFECE2" stroke="#E8A936" stroke-width="1.5"/>
    <text x="44" y="103" font-size="11" fill="#214B4D">Running 10 min late — traffic</text>

    <!-- map card -->
    <rect x="28" y="128" width="304" height="270" rx="20" fill="#EFEBDD" stroke="#E2DED5" stroke-width="2"/>
    <path d="M55 340 C 130 240, 220 300, 300 170" fill="none" stroke="#17666B" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
    <g transform="translate(150,275)">
      <rect x="-22" y="-14" width="44" height="26" rx="8" fill="#17666B"/>
      <circle cx="-12" cy="12" r="5" fill="#20343C"/>
      <circle cx="12" cy="12" r="5" fill="#20343C"/>
    </g>
    <path d="M300 148 C 289 148, 289 162, 300 178 C 311 162, 311 148, 300 148 Z" fill="#E8A936"/>

    <!-- eta card -->
    <rect x="28" y="412" width="304" height="120" rx="20" fill="#FDFDFC" stroke="#E2DED5" stroke-width="2"/>
    <text x="48" y="440" font-size="11" fill="#52706D">YOUR PICKUP POINT</text>
    <text x="48" y="466" font-size="17" font-weight="bold" fill="#214B4D">Aanya</text>
    <text x="48" y="500" font-size="26" font-weight="bold" fill="#17666B" font-family="Georgia, serif">~4 min away</text>

    <!-- status badges -->
    <text x="48" y="548" font-size="12" fill="#4C8C6B">✓ Boarded at 7:42 AM</text>
    <text x="48" y="572" font-size="12" fill="#52706D">Driver verified</text>
    <rect x="28" y="598" width="150" height="34" rx="17" fill="none" stroke="#E2DED5" stroke-width="1.5"/>
    <text x="103" y="620" text-anchor="middle" font-size="11" fill="#17666B">Mark absent today</text>

    <text x="180" y="700" text-anchor="middle" font-size="15" font-weight="bold" fill="#214B4D">Parent</text>
  </g>

  <!-- ============ DRIVER PHONE ============ -->
  <g transform="translate(410,20)">
    <rect x="0" y="0" width="360" height="720" rx="36" fill="#F9F6EC" stroke="#E2DED5" stroke-width="3"/>

    <!-- header -->
    <text x="28" y="52" font-size="17" font-weight="bold" fill="#214B4D">Morning Van · Green Park</text>
    <text x="28" y="72" font-size="12" fill="#52706D">Code: 8K3F92 · Share</text>

    <!-- broadcast composer -->
    <rect x="28" y="88" width="200" height="26" rx="13" fill="none" stroke="#E2DED5" stroke-width="1.5"/>
    <text x="128" y="105" text-anchor="middle" font-size="10" fill="#52706D">Running 10 min late</text>
    <rect x="238" y="88" width="94" height="26" rx="13" fill="none" stroke="#17666B" stroke-width="1.5"/>
    <text x="285" y="105" text-anchor="middle" font-size="10" fill="#17666B">Send</text>

    <!-- optimize route button -->
    <rect x="28" y="126" width="200" height="32" rx="16" fill="none" stroke="#17666B" stroke-width="1.5"/>
    <text x="128" y="147" text-anchor="middle" font-size="11" fill="#17666B">Optimize pickup route</text>

    <!-- map card -->
    <rect x="28" y="170" width="304" height="200" rx="20" fill="#EFEBDD" stroke="#E2DED5" stroke-width="2"/>
    <path d="M55 340 C 120 260, 230 320, 300 200" fill="none" stroke="#17666B" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
    <circle cx="120" cy="290" r="10" fill="#17666B"/>
    <text x="120" y="294" text-anchor="middle" font-size="9" fill="#F9F6EC">1</text>
    <circle cx="220" cy="255" r="10" fill="#17666B"/>
    <text x="220" y="259" text-anchor="middle" font-size="9" fill="#F9F6EC">2</text>
    <circle cx="290" cy="210" r="10" fill="#E8A936"/>
    <text x="290" y="214" text-anchor="middle" font-size="9" fill="#20343C">3</text>

    <!-- roster -->
    <g font-size="12">
      <circle cx="42" cy="398" r="10" fill="#17666B"/><text x="42" y="402" text-anchor="middle" font-size="9" fill="#F9F6EC">1</text>
      <text x="62" y="402" fill="#214B4D">Aanya</text>
      <rect x="200" y="388" width="56" height="22" rx="11" fill="#DFECE2" stroke="#4C8C6B" stroke-width="1.2"/>
      <text x="228" y="403" text-anchor="middle" font-size="9" fill="#4C8C6B">Board</text>
      <rect x="262" y="388" width="56" height="22" rx="11" fill="none" stroke="#E2DED5" stroke-width="1.2"/>
      <text x="290" y="403" text-anchor="middle" font-size="9" fill="#52706D">Drop</text>

      <circle cx="42" cy="434" r="10" fill="#17666B"/><text x="42" y="438" text-anchor="middle" font-size="9" fill="#F9F6EC">2</text>
      <text x="62" y="438" fill="#214B4D">Kabir</text>
      <rect x="200" y="424" width="56" height="22" rx="11" fill="none" stroke="#E2DED5" stroke-width="1.2"/>
      <text x="228" y="439" text-anchor="middle" font-size="9" fill="#52706D">Board</text>
      <rect x="262" y="424" width="56" height="22" rx="11" fill="none" stroke="#E2DED5" stroke-width="1.2"/>
      <text x="290" y="439" text-anchor="middle" font-size="9" fill="#52706D">Drop</text>
    </g>

    <!-- trip control -->
    <rect x="28" y="650" width="304" height="46" rx="23" fill="#C3392C"/>
    <text x="180" y="678" text-anchor="middle" font-size="14" font-weight="bold" fill="#F9F6EC">End trip</text>

    <text x="180" y="700" text-anchor="middle" font-size="0" fill="#214B4D"> </text>
    <text x="180" y="716" text-anchor="middle" font-size="15" font-weight="bold" fill="#214B4D">Driver</text>
  </g>

  <!-- ============ SCHOOL PHONE ============ -->
  <g transform="translate(800,20)">
    <rect x="0" y="0" width="360" height="720" rx="36" fill="#F9F6EC" stroke="#E2DED5" stroke-width="3"/>

    <!-- header -->
    <text x="28" y="52" font-size="17" font-weight="bold" fill="#214B4D">Greenwood High</text>
    <text x="28" y="72" font-size="12" fill="#52706D">Code: PZ82RM · Share</text>

    <!-- map with fleet dots -->
    <rect x="28" y="90" width="304" height="150" rx="20" fill="#EFEBDD" stroke="#E2DED5" stroke-width="2"/>
    <circle cx="90" cy="150" r="8" fill="#17666B"/>
    <circle cx="180" cy="185" r="8" fill="#17666B"/>
    <circle cx="260" cy="130" r="8" fill="#52706D"/>

    <!-- pending approval -->
    <text x="28" y="264" font-size="12" font-weight="bold" fill="#214B4D">Pending approval</text>
    <rect x="28" y="274" width="304" height="46" rx="14" fill="#FDFDFC" stroke="#E2DED5" stroke-width="1.5"/>
    <text x="42" y="302" font-size="12" fill="#214B4D">Evening Van · Lake Rd</text>
    <rect x="200" y="284" width="52" height="24" rx="12" fill="none" stroke="#4C8C6B" stroke-width="1.3"/>
    <text x="226" y="300" text-anchor="middle" font-size="9" fill="#4C8C6B">Approve</text>
    <rect x="258" y="284" width="52" height="24" rx="12" fill="none" stroke="#C3392C" stroke-width="1.3"/>
    <text x="284" y="300" text-anchor="middle" font-size="9" fill="#C3392C">Reject</text>

    <!-- fleet list -->
    <rect x="28" y="332" width="304" height="40" rx="12" fill="#FDFDFC" stroke="#E2DED5" stroke-width="1.5"/>
    <circle cx="46" cy="352" r="5" fill="#4C8C6B"/>
    <text x="62" y="349" font-size="12" fill="#214B4D">Morning Van · Green Park</text>
    <text x="62" y="364" font-size="10" fill="#52706D">On trip since 7:32 AM</text>

    <rect x="28" y="380" width="304" height="40" rx="12" fill="#FDFDFC" stroke="#E2DED5" stroke-width="1.5"/>
    <circle cx="46" cy="400" r="5" fill="#52706D"/>
    <text x="62" y="397" font-size="12" fill="#214B4D">Afternoon Van · Lake Rd</text>
    <text x="62" y="412" font-size="10" fill="#52706D">Idle</text>

    <!-- attendance trend -->
    <text x="28" y="452" font-size="12" font-weight="bold" fill="#214B4D">Attendance trend (7 days)</text>
    <g transform="translate(28,466)">
      <rect x="0" y="34" width="10" height="4" rx="2" fill="#E2DED5"/>
      <rect x="20" y="20" width="10" height="18" rx="2" fill="#E8A936"/>
      <rect x="40" y="30" width="10" height="8" rx="2" fill="#E8A936"/>
      <rect x="60" y="34" width="10" height="4" rx="2" fill="#E2DED5"/>
      <rect x="80" y="12" width="10" height="26" rx="2" fill="#E8A936"/>
      <rect x="100" y="34" width="10" height="4" rx="2" fill="#E2DED5"/>
      <rect x="120" y="34" width="10" height="4" rx="2" fill="#E2DED5"/>
    </g>

    <!-- route sheet -->
    <text x="28" y="540" font-size="12" font-weight="bold" fill="#214B4D">Route sheet</text>
    <rect x="28" y="550" width="304" height="34" rx="12" fill="none" stroke="#17666B" stroke-width="1.5"/>
    <text x="180" y="571" text-anchor="middle" font-size="11" fill="#17666B">Share route sheet</text>

    <text x="180" y="700" text-anchor="middle" font-size="15" font-weight="bold" fill="#214B4D">School</text>
  </g>
</svg>
