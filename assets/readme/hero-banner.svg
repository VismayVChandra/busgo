<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9F6EC"/>
      <stop offset="100%" stop-color="#F1ECDD"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- dashed route line, kept well above the wordmark -->
  <path d="M 90 95 C 280 30, 480 130, 660 55" fill="none" stroke="#17666B" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.55"/>

  <!-- start dot -->
  <circle cx="90" cy="95" r="8" fill="#17666B"/>

  <!-- end pin: simple circle-and-point marker -->
  <g transform="translate(660,55)">
    <path d="M 0 26 C -13 8, -13 -6, 0 -6 C 13 -6, 13 8, 0 26 Z" fill="#E8A936"/>
    <circle cx="0" cy="-2" r="6" fill="#F9F6EC"/>
  </g>

  <!-- bus glyph -->
  <g transform="translate(310,72)">
    <rect x="-38" y="-24" width="76" height="42" rx="13" fill="#17666B"/>
    <rect x="-29" y="-16" width="58" height="19" rx="6" fill="#F9F6EC" opacity="0.92"/>
    <circle cx="-19" cy="21" r="8" fill="#20343C"/>
    <circle cx="19" cy="21" r="8" fill="#20343C"/>
    <circle cx="-19" cy="21" r="3.2" fill="#F9F6EC"/>
    <circle cx="19" cy="21" r="3.2" fill="#F9F6EC"/>
  </g>

  <!-- wordmark, well clear of the route illustration above -->
  <text x="600" y="185" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="600" fill="#214B4D">Busgo</text>
  <text x="600" y="222" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="20" letter-spacing="2" fill="#52706D">LIVE SCHOOL VAN &amp; BUS TRACKING</text>
</svg>
